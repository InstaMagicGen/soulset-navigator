<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Soulset Navigator</title>

<style>
/* ------------------------- GLOBAL ------------------------- */
body {
  margin: 0;
  font-family: "Inter", sans-serif;
  background: #000;
  color: white;
  overflow: hidden;
}

#bg {
  position: fixed;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0.65;
  transition: background-image 1.6s ease-in-out;
  z-index: -1;
}

.main-btn {
  background: linear-gradient(120deg, #ffb88c, #ea5753);
  border: none;
  padding: 16px 32px;
  border-radius: 14px;
  color: #fff;
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

.main-btn.small {
  padding: 12px 24px;
  font-size: 1rem;
}

.sub-btn {
  background: rgba(255,255,255,0.1);
  padding: 10px 20px;
  border-radius: 10px;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.2);
  margin-top: 15px;
}

.screen {
  opacity: 0;
  transform: translateY(20px);
  transition: 0.6s;
  display: none;
  text-align: center;
  width: 100%;
  max-width: 480px;
  margin: auto;
}

.screen.visible {
  opacity: 1;
  transform: translateY(0);
  display: block;
}

.tagline {
  opacity: 0.8;
  margin-bottom: 30px;
}

textarea {
  width: 100%;
  border-radius: 10px;
  border: none;
  padding: 14px;
  min-height: 100px;
  background: rgba(0,0,0,0.45);
  color: white;
  margin-bottom: 15px;
}

.status {
  opacity: 0.7;
  margin-top: 12px;
}

/* --------------------- RITUEL ---------------------- */
.overlay {
  position: fixed;
  inset: 0;
  backdrop-filter: blur(18px);
  background: rgba(0,0,0,0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

.hidden {
  display: none;
}

.ritual-card {
  width: 90%;
  max-width: 520px;
  background: rgba(0,0,0,0.6);
  border-radius: 20px;
  overflow: hidden;
  text-align: center;
}

.ritual-text {
  padding: 20px;
}

video {
  width: 100%;
  display: block;
}
</style>
</head>

<body>

<!-- ░░░░░░░░░░░░░░░░░░ RITUEL ░░░░░░░░░░░░░░░░░░ -->
<div id="ritualOverlay" class="overlay hidden">
  <div class="ritual-card">
    <video id="ritualVideo" autoplay muted loop playsinline></video>

    <div class="ritual-text">
      <h2 id="ritualTitle"></h2>
      <p id="ritualMessage"></p>
    </div>

    <button id="ritualDone" class="main-btn"></button>
  </div>
</div>

<div id="bg"></div>

<main id="app">

  <!-- ░░░░░░░░░░ WELCOME SCREEN ░░░░░░░░░░ -->
  <section id="welcomeScreen" class="screen visible">
    <h1 id="appTitle"></h1>
    <p id="appTagline" class="tagline"></p>

    <button id="startBtn" class="main-btn"></button>

    <p id="welcomeHint" class="hint"></p>
  </section>

  <!-- ░░░░░░░░░░ DIALOGUE ░░░░░░░░░░ -->
  <section id="dialogueScreen" class="screen hidden">
    <h2 id="dialogTitle"></h2>
    <p id="dialogSubtitle"></p>

    <textarea id="userInput"></textarea>

    <button id="sendBtn" class="main-btn small"></button>

    <div id="responseBlock" class="hidden">
      <h3 id="guidanceLabel"></h3>
      <p id="assistantResponse"></p>

      <button id="listenBtn" class="sub-btn"></button>
    </div>

    <p id="typingStatus" class="status"></p>
  </section>

  <!-- ░░░░░░░░░░ PRO SCREEN ░░░░░░░░░░ -->
  <section id="proScreen" class="screen hidden">
    <h2 id="proTitle"></h2>
    <p id="proMessage"></p>

    <a href="https://gumroad.com" target="_blank"
       id="proButton" class="main-btn"></a>
  </section>

</main>

<script>
/* ----------------------- LANGUAGE ----------------------- */
const userLang = navigator.language.slice(0, 2);

const T = {
  fr: {
    title: "The Soulset Navigator",
    tagline: "Recenter • Understand • Reset",
    start: "Commencer",
    hint: "Une courte guidance pour apaiser ton mental.",
    dialogTitle: "Soulset Dialogue",
    dialogSubtitle: "Décris ce que tu ressens…",
    placeholder: "Exemple : « Je me sens fatigué émotionnellement. »",
    send: "Envoyer",
    guidance: "Guidance",
    listen: "Écouter",
    typing: "Une guidance se prépare…",
    proTitle: "Soulset Pro",
    proMessage: "Tu as utilisé ta session gratuite. Débloque un accès illimité.",
    proButton: "Débloquer Soulset Pro",
    ritualTitle: "Rituel Sunset",
    ritualText: "Regarde ce coucher de soleil pendant quelques secondes… respire…",
    ritualDone: "Je suis prêt(e)"
  },

  en: {
    title: "The Soulset Navigator",
    tagline: "Recenter • Understand • Reset",
    start: "Start",
    hint: "A short guidance to calm your mind.",
    dialogTitle: "Soulset Dialogue",
    dialogSubtitle: "Describe what you're feeling…",
    placeholder: "Example: “I feel mentally tired today.”",
    send: "Send",
    guidance: "Guidance",
    listen: "Listen",
    typing: "Preparing guidance…",
    proTitle: "Soulset Pro",
    proMessage: "You've used your free session. Unlock unlimited access.",
    proButton: "Unlock Soulset Pro",
    ritualTitle: "Sunset Ritual",
    ritualText: "Watch the sunset for a few seconds… breathe…",
    ritualDone: "I'm ready"
  }
};

const tr = T[userLang] || T["en"];

/* APPLY TEXT */
document.getElementById("appTitle").textContent = tr.title;
document.getElementById("appTagline").textContent = tr.tagline;
document.getElementById("startBtn").textContent = tr.start;
document.getElementById("welcomeHint").textContent = tr.hint;
document.getElementById("dialogTitle").textContent = tr.dialogTitle;
document.getElementById("dialogSubtitle").textContent = tr.dialogSubtitle;
document.getElementById("userInput").placeholder = tr.placeholder;
document.getElementById("sendBtn").textContent = tr.send;
document.getElementById("guidanceLabel").textContent = tr.guidance;
document.getElementById("listenBtn").textContent = tr.listen;
document.getElementById("proTitle").textContent = tr.proTitle;
document.getElementById("proMessage").textContent = tr.proMessage;
document.getElementById("proButton").textContent = tr.proButton;
document.getElementById("ritualTitle").textContent = tr.ritualTitle;
document.getElementById("ritualMessage").textContent = tr.ritualText;
document.getElementById("ritualDone").textContent = tr.ritualDone;


/* ----------------------- BACKGROUND ----------------------- */
const backgrounds = [
  "sunset-1.jpeg","sunset-2.jpeg","sunset-3.jpeg",
  "Sunset-4.jpeg","Sunset-5.jpeg","Sunset-6.jpeg","Sunset-7.jpeg"
];

let bgIndex = 0;
function updateBackground() {
  document.getElementById("bg").style.backgroundImage =
  `url('${backgrounds[bgIndex]}')`;
  bgIndex = (bgIndex + 1) % backgrounds.length;
}
setInterval(updateBackground, 10000);
updateBackground();


/* ----------------------- RITUEL ----------------------- */
const ritualVideos = [
  "Sunset-1V.mp4", "Sunset-3V.mp4", "Sunset-4V.mp4", "Sunset-ambient.mp4"
];

const ritualOverlay = document.getElementById("ritualOverlay");
document.getElementById("ritualDone").onclick = () => {
  ritualOverlay.classList.add("hidden");
  showScreen("dialogueScreen");
};

function openRitual() {
  const vid = ritualVideos[Math.floor(Math.random()*ritualVideos.length)];
  document.getElementById("ritualVideo").src = vid;
  ritualOverlay.classList.remove("hidden");
}


/* ----------------------- FREE LIMIT ----------------------- */
let firstUse = localStorage.getItem("soulset_free") === null;

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("visible"));
  document.getElementById(id).classList.add("visible");
}


/* ---------------------- START BUTTON ---------------------- */
document.getElementById("startBtn").onclick = () => {
  if (firstUse) openRituel();
  else showScreen("proScreen");
};


/* ---------------------- SEND BUTTON ----------------------- */
document.getElementById("sendBtn").onclick = async () => {
  const text = document.getElementById("userInput").value.trim();
  if (!text) return;

  if (firstUse) {
    localStorage.setItem("soulset_free","used");
    firstUse = false;
  }

  document.getElementById("typingStatus").textContent = tr.typing;

  const response = 
    "Respire profondément… tu fais de ton mieux. " +
    "Accorde-toi un instant, reconnecte-toi à ton intention du moment.";

  document.getElementById("assistantResponse").textContent = response;
  document.getElementById("responseBlock").classList.remove("hidden");
  document.getElementById("typingStatus").textContent = "";
};


/* ---------------------- COQUI TTS ------------------------- */
document.getElementById("listenBtn").onclick = async () => {
  const text = document.getElementById("assistantResponse").textContent;

  const res = await fetch("https://huggingface.co/spaces/coqui/tts/api/predict", {
    method: "POST",
    headers: { "Content-Type":"application/json" },
    body: JSON.stringify({ text })
  });

  const data = await res.json();
  const audio = new Audio(data.audio);
  audio.play();
};
</script>

</body>
</html>
